pluginManagement {
    plugins {
        id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
        id 'org.jetbrains.kotlin.jvm' version '2.0.0'
        id 'jacoco'
    }
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
}

rootProject.name = 'IngsisTP'

// Core Language Models
include 'token', 'ast'

// Compiler Pipeline Engines
include 'lexer', 'parser', 'interpreter', 'formatter', 'linter'

// Application & Integration Tests
include 'cli', 'globalTests'
