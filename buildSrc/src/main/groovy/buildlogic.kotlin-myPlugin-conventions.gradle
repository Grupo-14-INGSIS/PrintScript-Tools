plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'jacoco'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

//verificación de que nuestro plugin está activo
project.gradle.taskGraph.whenReady {
    project.logger.lifecycle(">>>>> myPlugin is working <<<<<")
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"
    testImplementation "org.jetbrains.kotlin:kotlin-test:2.0.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.9.2"
    testImplementation "io.mockk:mockk:1.13.7"
    implementation 'org.yaml:snakeyaml:1.33'
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.3"
}

compileKotlin {
    kotlinOptions { jvmTarget = "21" }
}
compileTestKotlin {
    kotlinOptions { jvmTarget = "21" }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit { minimum = 0.8 }
        }
    }
}

tasks.named("test") {
    if (rootProject.tasks.findByName("installGitHook") != null) {
        dependsOn(rootProject.tasks.named("installGitHook"))
    }
}

tasks.named("build") {
    dependsOn "ktlintCheck", "test"
}

ktlint {
    if (file("$rootDir/.editorconfig").exists()) {
        additionalEditorconfigFile = file("$rootDir/.editorconfig")
    }
}

// Para publicar objetos
publishing {
    publications {
        gpr(MavenPublication) {
            from(components.java)
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/Grupo-14-INGSIS/PrintScript-Tools'
            credentials {
                username = project.findProperty("gpr.user")
                password = project.findProperty("gpr.key")
            }
        }
    }
}